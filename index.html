<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0513">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тусим 18+">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<title>Тусим 18+</title>
<style>
  .hero { padding: 10px 2px 2px; }
  .hero h1 { font-size: 40px; }
  .hero .sub { margin-top: 8px; }
  .games { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .game {
    position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; gap: 18px;
    min-height: 168px; padding: 16px; border-radius: 22px; text-decoration: none; color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    transition: transform 0.12s ease;
  }
  .game:active { transform: scale(0.97); }
  .game.wide { grid-column: span 2; min-height: 150px; }
  .game .em { font-size: 40px; line-height: 1; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3)); }
  .game .em.big-em { position: absolute; right: -10px; bottom: -18px; font-size: 120px; opacity: 0.9; transform: rotate(-12deg); }
  .game h3 { font-size: 19px; line-height: 1.15; }
  .game p { margin: 6px 0 0; font-size: 13px; line-height: 1.35; opacity: 0.85; max-width: 26ch; }
  .game .need { position: absolute; top: 12px; right: 12px; font-size: 12px; font-weight: 800; padding: 4px 8px; border-radius: 999px; background: rgba(0, 0, 0, 0.28); }
  .game.locked { filter: saturate(0.4) brightness(0.75); }
  .g-elias { background: linear-gradient(140deg, #ff3d8b, #a2269a); }
  .g-spy { background: linear-gradient(140deg, #3b2a8f, #121a4a); }
  .g-truth { background: linear-gradient(140deg, #ff7a45, #d9265e); }
  .g-never { background: linear-gradient(140deg, #0fa89a, #1d4f7a); }
  .g-who { background: linear-gradient(140deg, #8b5cf6, #4c1d95); }
  .install { display: flex; gap: 12px; align-items: center; }
  .install .em { font-size: 28px; }
</style>
</head>
<body>

<section class="screen active" id="home">
  <div class="hero">
    <h1>Тусим <span class="accent">18+</span></h1>
    <p class="sub">Игры на компанию: впиши всех один раз — дальше любые игры в пару тапов.</p>
  </div>

  <div class="panel">
    <h2>Игроки <span class="sub" id="pCount"></span></h2>
    <div id="playersBox"></div>
  </div>

  <div class="games" id="games"></div>

  <div class="panel install" id="installTip">
    <span class="em">📲</span>
    <p class="sub small">Добавь на главный экран — будет как приложение и заработает без интернета.
      <b style="color:var(--text)">iPhone:</b> «Поделиться» → «На экран Домой».
      <b style="color:var(--text)">Android:</b> «⋮» → «Добавить на главный экран».</p>
  </div>
</section>

<script src="common.js"></script>
<script>
const GAMES = [
  { href: "elias.html", cls: "g-elias wide", em: "🔥", title: "Элиас 18+", desc: "Объясняй слова команде на время. Команды соберутся сами.", min: 4, bigEm: true },
  { href: "spy.html", cls: "g-spy", em: "🕵️", title: "Шпион", desc: "Все знают локацию, кроме шпиона. Вычисли его.", min: 3 },
  { href: "truth.html", cls: "g-truth", em: "😈", title: "Правда или действие", desc: "Лайт или жара 18+.", min: 2 },
  { href: "cards.html?g=never", cls: "g-never", em: "🙊", title: "Я никогда не…", desc: "Кто делал — пьёт.", min: 2 },
  { href: "cards.html?g=who", cls: "g-who", em: "👉", title: "Кто скорее всего", desc: "На счёт три — все тычут пальцем.", min: 3 }
];

function renderGames(ps) {
  const n = ps.length;
  $("pCount").textContent = n ? n + " " + plural(n, "игрок", "игрока", "игроков") : "";
  $("games").innerHTML = GAMES.map(g => {
    const ok = n >= g.min;
    return `<a class="game ${g.cls} ${ok ? "" : "locked"}" href="${g.href}">
      <span class="need">${ok ? "✓" : "от " + g.min} 👥</span>
      <span class="em ${g.bigEm ? "big-em" : ""}">${g.em}</span>
      <div><h3>${g.title}</h3><p>${g.desc}</p></div>
    </a>`;
  }).join("");
}
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

playersEditor($("playersBox"), renderGames);
if (window.matchMedia("(display-mode: standalone)").matches || navigator.standalone) $("installTip").style.display = "none";
ageGate();
</script>
</body>
</html>
